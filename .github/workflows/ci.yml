# 코드 품질 게이트 — 타입·린트·단위 테스트·프로덕션 빌드.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 필드에서 읽는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # 타입 검사만으로는 프로덕션 빌드가 통과하는지 알 수 없다 — 라우트 수집, 정적 생성,
      # 번들링은 tsc 가 보지 않는 단계다. 산출물은 버리고 컴파일 여부만 본다.
      #
      # env 구성은 dockerfiles/Dockerfile.nextjs 와 같다: `SKIP_ENV_VALIDATION=1` 은
      # `src/lib/env.ts` 가 빌드 단계에서만(`NEXT_PHASE` 확인) 허용하는 탈출구이고,
      # `NEXT_PUBLIC_*` 는 넘기지 않는다 — 빌드가 그 값을 요구하지 않는다는 것 자체가
      # 이 단계가 지키는 불변식이다.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: '1'
