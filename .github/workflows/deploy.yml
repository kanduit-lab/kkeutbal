# ============================================
# Multi-Environment Deploy Workflow (CI + CD)
#
# Copy this file to your service repo:
#   .github/workflows/deploy.yml
#
# Environments:
#   - production: deploys on stable v* tags (no prerelease suffix)
#   - staging:    auto-deploys on configured branches (default: develop)
#   - preview:    auto-deploys on PR open/update, cleaned up on PR close
#
# Prerequisites:
#   1. dockerfiles/ folder in your repo
#   2. .dockerignore in your repo
#   3. Health check endpoint in your app
#   4. deploy-hub-gateway running on server (via setup-server.sh)
#   5. GitHub Environments: "staging", "production" (with required reviewers)
#   6. .deploy.yml config file in repo root
#
# Secrets — two approaches (choose one):
#
#   A) GitHub Environment secrets (recommended):
#      Settings > Environments > production > ENV_FILE_BASE64
#      Settings > Environments > staging    > ENV_FILE_BASE64
#      Uses `secrets: inherit` — each environment gets its own .env automatically.
#
#   B) Repo-level secrets (legacy):
#      Settings > Secrets > Actions:
#        ENV_FILE_BASE64            — fallback .env
#        ENV_FILE_BASE64_PRODUCTION — production-specific
#        ENV_FILE_BASE64_STAGING    — staging-specific
#
#   Common secrets (Settings > Secrets > Actions):
#     DEPLOY_REPO_TOKEN         — PAT with contents:read (if central repo is private)
#     NOTIFICATION_WEBHOOK_URL  — (optional) webhook
# ============================================

name: Deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ── Dedupe: when a v* tag and main/master are pushed together, let the tag run win ──
  skip-duplicate-branch:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          SKIP=false
          MATCH=""

          if [[ "${GITHUB_EVENT_NAME}" == "push" && ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ) ]]; then
            git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
            MATCH=$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | head -n 1 || true)
            if [[ -n "$MATCH" ]]; then
              SKIP=true
              echo "Same commit already has version tag ${MATCH}; skipping branch CI/CD."
            fi
          fi

          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "tag=${MATCH}" >> "$GITHUB_OUTPUT"

  # ── Config: read .deploy.yml ──
  config:
    needs: skip-duplicate-branch
    if: ${{ needs.skip-duplicate-branch.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.cfg.outputs.app_name }}
      framework: ${{ steps.cfg.outputs.framework }}
      domain: ${{ steps.cfg.outputs.domain }}
      staging_domain: ${{ steps.cfg.outputs.staging_domain }}
      health_path: ${{ steps.cfg.outputs.health_path }}
      memory_limit: ${{ steps.cfg.outputs.memory_limit }}
      cpu_limit: ${{ steps.cfg.outputs.cpu_limit }}
      network: ${{ steps.cfg.outputs.network }}
      network_strict: ${{ steps.cfg.outputs.network_strict }}
      deploy_env: ${{ steps.cfg.outputs.deploy_env }}
      runner_labels: ${{ steps.cfg.outputs.runner_labels }}
      trivy_scan: ${{ steps.cfg.outputs.trivy_scan }}
      verify_deployment: ${{ steps.cfg.outputs.verify_deployment }}
      runner_labels_amd64: ${{ steps.cfg.outputs.runner_labels_amd64 }}
      runner_labels_arm64: ${{ steps.cfg.outputs.runner_labels_arm64 }}
      notifications: ${{ steps.cfg.outputs.notifications }}
      preview_enabled: ${{ steps.cfg.outputs.preview_enabled }}
      preview_max: ${{ steps.cfg.outputs.preview_max }}
      is_staging: ${{ steps.cfg.outputs.is_staging }}
      sidecar_services: ${{ steps.cfg.outputs.sidecar_services }}
      health_timeout: ${{ steps.cfg.outputs.health_timeout }}
      post_sidecar: ${{ steps.cfg.outputs.post_sidecar }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .deploy.yml
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: kanduit-lab/docker-deploy-control-hub
          ref: 'v2'
          token: ${{ secrets.DEPLOY_REPO_TOKEN || github.token }}
          sparse-checkout: lib/config/parse-deploy-yml.sh
          sparse-checkout-cone-mode: false
          path: _hub
      - id: cfg
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: bash _hub/lib/config/parse-deploy-yml.sh .deploy.yml

  # ── CI: Build ──────────────────────────────
  # push: build test on feature branches, build+push on v* tags + staging branches
  # pull_request: build+push when preview enabled
  build:
    needs: config
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed')
    uses: kanduit-lab/docker-deploy-control-hub/.github/workflows/ci-reusable.yml@v2
    with:
      framework: ${{ needs.config.outputs.framework }}
      push: >-
        ${{
          startsWith(github.ref, 'refs/tags/v')
          || needs.config.outputs.is_staging == 'true'
          || (github.event_name == 'pull_request'
              && needs.config.outputs.preview_enabled == 'true')
        }}
      trivy_scan: ${{ needs.config.outputs.trivy_scan == 'true' }}
      runner_labels_amd64: ${{ needs.config.outputs.runner_labels_amd64 }}
      runner_labels_arm64: ${{ needs.config.outputs.runner_labels_arm64 }}
    secrets:
      ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
      RUNNERS_PAT: ${{ secrets.RUNNERS_PAT }}

  # ── Staging: compute branch slug ──
  staging-slug:
    needs: config
    if: >-
      github.event_name == 'push' &&
      needs.config.outputs.is_staging == 'true'
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.value }}
      site_url: ${{ steps.slug.outputs.site_url }}
      suffix: ${{ steps.slug.outputs.suffix }}
    steps:
      - id: slug
        env:
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          STAGING_DOMAIN: ${{ needs.config.outputs.staging_domain }}
        run: |
          # Branch: develop → develop, release/2.0 → release-2-0
          SLUG=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|[/._]|-|g' | cut -c1-20 | sed 's/-$//')

          HASH="${GIT_SHA:0:7}"

          # Substitute {channel} (or legacy {branch}) and {hash} in domain pattern
          SITE_DOMAIN=$(echo "$STAGING_DOMAIN" | sed "s/{channel}/${SLUG}/g" | sed "s/{branch}/${SLUG}/g" | sed "s/{hash}/${HASH}/g")
          SITE_URL="https://${SITE_DOMAIN}"

          echo "value=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "suffix=staging-${SLUG}" >> "$GITHUB_OUTPUT"
          echo "Staging: ${SLUG} → ${SITE_URL}"

  # ── CD: Staging (configured staging branches) ──
  staging:
    needs: [config, build, staging-slug]
    if: >-
      github.event_name == 'push' &&
      needs.config.outputs.is_staging == 'true'
    uses: kanduit-lab/docker-deploy-control-hub/.github/workflows/cd-reusable.yml@v2
    with:
      app_name: ${{ needs.config.outputs.app_name }}
      framework: ${{ needs.build.outputs.framework || needs.config.outputs.framework }}
      image_ref: ${{ needs.build.outputs.image_ref }}
      site_url: ${{ needs.staging-slug.outputs.site_url }}
      health_path: ${{ needs.config.outputs.health_path }}
      network: ${{ needs.config.outputs.network_strict == 'true' && format('strict:{0}', needs.config.outputs.network) || needs.config.outputs.network }}
      memory_limit: ${{ needs.config.outputs.memory_limit }}
      cpu_limit: ${{ needs.config.outputs.cpu_limit }}
      deploy_env: staging
      env_suffix: ${{ needs.staging-slug.outputs.suffix }}
      runner_labels: ${{ needs.config.outputs.runner_labels }}
      deploy_repo: kanduit-lab/docker-deploy-control-hub
      deploy_ref: v2
      verify_deployment: ${{ needs.config.outputs.verify_deployment == 'true' }}
      sidecar_services: ${{ needs.config.outputs.sidecar_services }}
      health_timeout: ${{ fromJSON(needs.config.outputs.health_timeout || '60') }}
      git_sha: ${{ needs.build.outputs.git_sha }}

    secrets: inherit

  # ── CD: Production (stable v* tag only, no prerelease) ──
  production:
    needs: [config, build]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-')
    uses: kanduit-lab/docker-deploy-control-hub/.github/workflows/cd-reusable.yml@v2
    with:
      app_name: ${{ needs.config.outputs.app_name }}
      framework: ${{ needs.build.outputs.framework || needs.config.outputs.framework }}
      image_ref: ${{ needs.build.outputs.image_ref }}
      site_url: https://${{ needs.config.outputs.domain }}
      health_path: ${{ needs.config.outputs.health_path }}
      network: ${{ needs.config.outputs.network_strict == 'true' && format('strict:{0}', needs.config.outputs.network) || needs.config.outputs.network }}
      memory_limit: ${{ needs.config.outputs.memory_limit }}
      cpu_limit: ${{ needs.config.outputs.cpu_limit }}
      deploy_env: ${{ needs.config.outputs.deploy_env }}
      runner_labels: ${{ needs.config.outputs.runner_labels }}
      deploy_repo: kanduit-lab/docker-deploy-control-hub
      deploy_ref: v2
      create_release: true
      git_ref: ${{ github.ref }}
      verify_deployment: ${{ needs.config.outputs.verify_deployment == 'true' }}
      sidecar_services: ${{ needs.config.outputs.sidecar_services }}
      health_timeout: ${{ fromJSON(needs.config.outputs.health_timeout || '60') }}
      git_sha: ${{ needs.build.outputs.git_sha }}

    secrets: inherit

  # ── CD: Preview (per PR — ephemeral) ────────────────────
  preview:
    needs: [config, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.config.outputs.preview_enabled == 'true'
    uses: kanduit-lab/docker-deploy-control-hub/.github/workflows/cd-reusable.yml@v2
    with:
      app_name: ${{ needs.config.outputs.app_name }}
      framework: ${{ needs.build.outputs.framework || needs.config.outputs.framework }}
      image_ref: ${{ needs.build.outputs.image_ref }}
      site_url: https://${{ needs.config.outputs.domain }}
      health_path: ${{ needs.config.outputs.health_path }}
      network: ${{ needs.config.outputs.network_strict == 'true' && format('strict:{0}', needs.config.outputs.network) || needs.config.outputs.network }}
      memory_limit: ${{ needs.config.outputs.memory_limit }}
      cpu_limit: ${{ needs.config.outputs.cpu_limit }}
      runner_labels: ${{ needs.config.outputs.runner_labels }}
      deploy_repo: kanduit-lab/docker-deploy-control-hub
      deploy_ref: v2
      preview: true
      preview_sha: ${{ github.event.pull_request.head.sha }}
      preview_branch: ${{ github.head_ref }}
      preview_max: ${{ fromJSON(needs.config.outputs.preview_max) }}
      verify_deployment: ${{ needs.config.outputs.verify_deployment == 'true' }}
      sidecar_services: ${{ needs.config.outputs.sidecar_services }}
      health_timeout: ${{ fromJSON(needs.config.outputs.health_timeout || '60') }}
      git_sha: ${{ github.event.pull_request.head.sha }}

    secrets: inherit

  # ── Preview Cleanup: remove preview when PR is closed ────────────────────
  cleanup-preview:
    needs: config
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      needs.config.outputs.preview_enabled == 'true'
    uses: kanduit-lab/docker-deploy-control-hub/.github/workflows/preview-cleanup-reusable.yml@v2
    with:
      app_name: ${{ needs.config.outputs.app_name }}
      runner_labels: ${{ needs.config.outputs.runner_labels }}
      branch: ${{ github.head_ref }}
      sidecar_services: ${{ needs.config.outputs.sidecar_services }}
    secrets: inherit
