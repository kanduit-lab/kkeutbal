# Supabase Keep-Alive — 앱의 인증된 엔드포인트가 `select 1`을 실행한다.
# GitHub Actions secret `KEEP_ALIVE_SECRET`은 배포 환경의 같은 이름 값과 일치해야 한다.

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run authenticated database ping
        env:
          APP_URL: https://kkeutbal.kanduit.app
          KEEP_ALIVE_SECRET: ${{ secrets.KEEP_ALIVE_SECRET }}
        run: |
          curl --fail --silent --show-error -X POST \
            "$APP_URL/api/keep-alive" \
            -H "Authorization: Bearer $KEEP_ALIVE_SECRET"
